name: build

# the core: builds, tests and packages the update site. Pull requests run it directly;
# pages.yml calls it before publishing, so what is deployed is exactly what was tested
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# its own group: a called workflow sharing the caller's group would wait on itself
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # the MCP server and its tools are compiled for JavaSE-25, and Tycho resolves
          # the target platform against that execution environment
          java-version: '25'
          # caches ~/.m2/repository, which holds Tycho's p2 cache as well: without it
          # every build downloads the platform, MAT and the MCP server again
          cache: maven

      - name: Build and test
        # the version comes out of the build itself, from the commit: nothing to set here
        run: mvn -B clean verify

      - name: Keep the test output of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            tests/*/target/surefire-reports/**
            tests/*/target/work/data/.metadata/.log
          if-no-files-found: ignore

      # one address installs everything: the site is a composite whose children are this
      # build's own repository and the sites MAT, the MCP server and Calcite live on
      - name: Compose the update site
        run: .github/scripts/compose-site.sh update-site/hu.rxd.auspex.mortis.repository/target/repository site

      # the p2 repository in the shape GitHub Pages deploys; on a pull request it is
      # simply the build output, downloadable for trying the change
      - name: Package the update site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # Memory Analyzer with everything already in it, for a machine that has no Eclipse;
      # the artifact's size is the archive's size, which is the cost this has to stay worth
      - name: Keep the product archive
        uses: actions/upload-artifact@v4
        with:
          name: auspex-mortis-linux.gtk.x86_64
          path: product/*/target/products/*.tar.gz
          if-no-files-found: error
