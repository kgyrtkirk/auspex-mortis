name: build

# the core: builds, tests and packages the update site. Pull requests run it directly;
# pages.yml calls it before publishing, so what is deployed is exactly what was tested
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# its own group: a called workflow sharing the caller's group would wait on itself
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # the MCP server and its tools are compiled for JavaSE-25, and Tycho resolves
          # the target platform against that execution environment
          java-version: '25'
          # caches ~/.m2/repository, which holds Tycho's p2 cache as well: without it
          # every build downloads the platform, MAT and the MCP server again
          cache: maven

      - name: Build and test
        run: mvn -B clean verify

      - name: Keep the test output of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            tests/*/target/surefire-reports/**
            tests/*/target/work/data/.metadata/.log
          if-no-files-found: ignore

      # the p2 repository in the shape GitHub Pages deploys; on a pull request it is
      # simply the build output, downloadable for trying the change
      - name: Package the update site
        uses: actions/upload-pages-artifact@v3
        with:
          path: update-site/hu.rxd.auspex.mortis.repository/target/repository
