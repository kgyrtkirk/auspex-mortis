<?xml version="1.0" encoding="UTF-8"?>
<!--
  Auspex Mortis — the mark.

  A Mechanicus cog for the machine the tools run inside, a skull for the dump, and in the
  sockets the only thing this product ever really shows a person: bars of retained heap. The
  brimstone sign on the brow is the glyph the README carries.

  Drawn to read at 16 px: three shapes, two colours, nothing thinner than two units.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"
     role="img" aria-label="Auspex Mortis">
  <title>Auspex Mortis</title>

  <defs>
    <g id="tooth">
      <rect x="119" y="4" width="18" height="24" rx="3"/>
    </g>
  </defs>

  <circle cx="128" cy="128" r="126" fill="#12141a"/>

  <g fill="#9a6b34">
    <use href="#tooth"/>
    <use href="#tooth" transform="rotate(30 128 128)"/>
    <use href="#tooth" transform="rotate(60 128 128)"/>
    <use href="#tooth" transform="rotate(90 128 128)"/>
    <use href="#tooth" transform="rotate(120 128 128)"/>
    <use href="#tooth" transform="rotate(150 128 128)"/>
    <use href="#tooth" transform="rotate(180 128 128)"/>
    <use href="#tooth" transform="rotate(210 128 128)"/>
    <use href="#tooth" transform="rotate(240 128 128)"/>
    <use href="#tooth" transform="rotate(270 128 128)"/>
    <use href="#tooth" transform="rotate(300 128 128)"/>
    <use href="#tooth" transform="rotate(330 128 128)"/>
  </g>
  <circle cx="128" cy="128" r="104" fill="none" stroke="#9a6b34" stroke-width="14"/>
  <circle cx="128" cy="128" r="97" fill="#0e1013"/>
  <circle cx="128" cy="128" r="93" fill="none" stroke="#e2622a" stroke-width="2" opacity="0.7"/>

  <!-- the dump -->
  <g fill="#e8e3d6">
    <path d="M128 66c-29 0-50 21-50 50 0 17 7 28 15 35v13c0 6 5 11 11 11h48c6 0 11-5 11-11v-13
             c8-7 15-18 15-35 0-29-21-50-50-50z"/>
  </g>

  <!-- brimstone, on the brow -->
  <g stroke="#e2622a" stroke-width="3" fill="none" stroke-linejoin="round">
    <path d="M128 78l9 15h-18z"/>
    <path d="M128 95v12M121 101h14"/>
  </g>

  <!-- what it is looking at: retained heap, in the sockets -->
  <g>
    <circle cx="108" cy="126" r="15" fill="#0e1013"/>
    <circle cx="148" cy="126" r="15" fill="#0e1013"/>
    <g fill="#e2622a">
      <rect x="100" y="126" width="4" height="7" rx="1"/>
      <rect x="106" y="120" width="4" height="13" rx="1"/>
      <rect x="112" y="123" width="4" height="10" rx="1"/>
      <rect x="140" y="123" width="4" height="10" rx="1"/>
      <rect x="146" y="120" width="4" height="13" rx="1"/>
      <rect x="152" y="126" width="4" height="7" rx="1"/>
    </g>
  </g>

  <path d="M128 140l7 14h-14z" fill="#0e1013"/>

  <g stroke="#0e1013" stroke-width="3" stroke-linecap="round">
    <path d="M104 162h48"/>
    <path d="M114 162v11M128 162v11M142 162v11"/>
  </g>
</svg>
