# Preference defaults of the Auspex Mortis product. Read only when this product is the one
# running, so an IDE that merely has the plug-in installed is untouched by every line here.

# Memory Analyzer's own, because this product runs Memory Analyzer's application
org.eclipse.ui/SHOW_MEMORY_MONITOR=true
org.eclipse.ui/KEY_CONFIGURATION_ID=org.eclipse.mat.scheme
org.eclipse.ui/SHOW_PROGRESS_ON_STARTUP=false

# not Memory Analyzer's: it runs a parse in a modal progress dialog, which owns the UI thread
# for the whole parse. Every tool that has to reach an editor queues behind that dialog, with
# nobody there to watch it, so a run would look wedged for the tens of minutes it takes.
org.eclipse.ui.workbench/RUN_IN_BACKGROUND=true

# the endpoint is the reason this product exists, so it listens out of the box. Installed into
# an IDE somebody else set up, the server keeps its own default and stays opt-in.
com.vogella.eclipse.mcp.server/enabled=true

# 30 seconds bounds a tool call in an IDE, where a call reads the Java model. Here a call can
# be a parse of tens of minutes or a query over hundreds of millions of objects, and a client
# that is cut off at 30 seconds learns nothing about work that carries on regardless.
com.vogella.eclipse.mcp.server/callTimeoutSeconds=1800
